name: Lint and Test

on:
  push:
    branches: [ main ]
    tags: '**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.14t", "3.15"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - name: "Setup uv ${{ matrix.python-version }} / ${{ matrix.os }}"
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Rust
      run: rustup toolchain install stable
    - name: Build
      run: uv sync --dev --all-extras
    - name: Lint
      run: |
        uv run ruff check
        uv run ty check
    - name: Test
      if: matrix.python-version != '3.14' || matrix.os != 'ubuntu-latest'
      run: |
        uv run pytest -sv
    - name: Test with coverage
      if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
      run: |
        uv run pytest -sv --cov=xenoform_rs
    - name: Run examples
      run: |
        uv run examples/loop.py
        uv run examples/distance_matrix.py
        uv run examples/monte_carlo.py
        uv run examples/levenshtein.py

  # The single required status check for merging into main (ruleset `lock-main`), so that changing the matrix
  # never requires editing the ruleset. A skipped required check counts as passing, hence `if: always()`.
  all-checks:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
    - run: test "${{ needs.build.result }}" = success
