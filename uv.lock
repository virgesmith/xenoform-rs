requires-dist = [
    { name = "itrx", specifier = ">=0.2.1" },
    { name = "numpy", specifier = ">=2.4.3" },
    { name = "pandas", marker = "extra == 'examples'", specifier = ">=3.0" },
    { name = "pydantic-settings", specifier = ">=2.13.1" },
]
