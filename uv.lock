dev = [
    { name = "pre-commit", specifier = ">=4.5.1" },
    { name = "pytest", specifier = ">=9.0.2" },
    { name = "pytest-cov", specifier = ">=7.1.0" },
    { name = "ruff", specifier = ">=0.15.6" },
    { name = "ty", specifier = ">=0.0.23" },
]
